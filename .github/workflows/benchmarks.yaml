name: Benchmark

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Branch/ref to compare against (baseline). Defaults to upstream main."
        required: false
        default: "main"
      python_version:
        description: "CPython version to run the benchmarks on"
        required: false
        default: "3.12"
      benchmark_scope:
        description: "asv `--bench` glob to limit which benchmarks run (blank = all)"
        required: false
        default: ""

concurrency:
  # Cancel previous workflows of the same PR, but only for PRs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    if: contains(github.event.label.name, 'benchmark') || github.event_name == 'workflow_dispatch'
    name: Linux
    runs-on: ubuntu-latest
    env:
      CCACHE_BASEDIR: "${{ github.workspace }}"
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_MAXSIZE: 400M

    steps:
      # We need the full repo to avoid this issue
      # https://github.com/actions/checkout/issues/23
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: "${{ inputs.python_version || '3.12' }}"
          allow-prereleases: true
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      # Point asv at the interpreter chosen for this run (asv reads `pythons`
      # from asv.conf.json). This lets a dispatch run the benchmarks on, e.g.,
      # CPython 3.15 without editing the committed config.
      - name: Configure asv for the chosen Python
        shell: bash -l {0}
        env:
          PYTHON_VERSION: "${{ inputs.python_version || '3.12' }}"
        run: |
          python - "$PYTHON_VERSION" <<'PY'
          import json, sys
          pyv = sys.argv[1]
          with open('asv.conf.json') as f:
              conf = json.load(f)
          conf['pythons'] = [pyv]
          with open('asv.conf.json', 'w') as f:
              json.dump(conf, f, indent=2)
          PY
          echo "asv will run on Python $PYTHON_VERSION"

      - name: Setup some dependencies
        shell: bash -l {0}
        run: |
          pip install asv
          sudo apt-get update -y && sudo apt-get install -y ccache
          # Make gcc/gxx symlinks first in path
          sudo /usr/sbin/update-ccache-symlinks
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: "Prepare ccache"
        id: prepare-ccache
        shell: bash -l {0}
        run: |
          echo "key=benchmark-$RUNNER_OS" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          ccache -p
          ccache -z

      - name: "Restore ccache"
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ secrets.CACHE_VERSION }}-${{ steps.prepare-ccache.outputs.key }}-${{ steps.prepare-ccache.outputs.timestamp }}
          restore-keys: |
            ccache-${{ secrets.CACHE_VERSION }}-${{ steps.prepare-ccache.outputs.key }}-

      - name: Run benchmarks
        shell: bash -l {0}
        id: benchmark
        env:
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          ASV_FACTOR: 1.5
          ASV_SKIP_SLOW: 1
          # Escape user controlled variables
          BENCHMARK_SCOPE: "${{ inputs.benchmark_scope || '' }}"
          BASE_REF: "${{ inputs.base_ref || 'main' }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PR_BASE_LABEL: "${{ github.event.pull_request.base.label }}"
        run: |
          set -x

          python -m pip install virtualenv

          # ID this runner
          asv machine --yes

          # Determine the baseline SHA/label for this run
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASELINE_SHA="$PR_BASE_SHA"
            BASELINE_LABEL="$PR_BASE_LABEL"
          else
            # workflow_dispatch: compare against the chosen ref on upstream
            git remote add upstream https://github.com/scikit-image/scikit-image.git || true
            git fetch upstream "$BASE_REF" --depth=1
            BASELINE_SHA="$(git rev-parse "upstream/$BASE_REF")"
            BASELINE_LABEL="$BASE_REF"
          fi
          echo "Baseline: $BASELINE_SHA ($BASELINE_LABEL)"
          echo "Contender: $GITHUB_SHA"

          # Optional benchmark scope (use a bash array so the value is a single,
          # correctly-quoted argument to asv)
          BENCH_ARGS=()
          if [ -n "$BENCHMARK_SCOPE" ]; then
            BENCH_ARGS=(--bench "$BENCHMARK_SCOPE")
          fi

          # Run benchmarks for current commit against base
          ASV_OPTIONS="--split --show-stderr --factor $ASV_FACTOR"
          asv continuous $ASV_OPTIONS "${BENCH_ARGS[@]}" $BASELINE_SHA $GITHUB_SHA \
              | sed "/Traceback \|failed$\|PERFORMANCE DECREASED/ s/^/::error::/" \
              | tee benchmarks.log

          # Report and export results for subsequent steps
          if grep "Traceback \|failed\|PERFORMANCE DECREASED" benchmarks.log > /dev/null ; then
              exit 1
          fi

      - name: "Check ccache performance"
        shell: bash -l {0}
        run: ccache -s
        if: always()

      - name: Add instructions to artifact
        if: always()
        run: cp benchmarks/README_CI.md benchmarks.log .asv/results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asv-benchmark-results-${{ runner.os }}
          path: .asv/results
